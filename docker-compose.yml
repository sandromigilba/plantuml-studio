services:
  # Server resmi PlantUML berbasis Jetty (offline & self-hosted)
  plantuml-server:
    image: plantuml/plantuml-server:jetty
    container_name: plantuml-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=plantuml

  # Aplikasi Web PlantUML Studio (Nuxt 3/4)
  plantuml-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantuml-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PLANTUML_SERVER_URL=http://plantuml-server:8080
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - plantuml-server
